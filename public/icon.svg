<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#14110d"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#3a3125" stroke-width="4"/>

  <!-- round table -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#c9a86a" stroke-width="9" opacity="0.5"/>

  <!-- five seats -->
  <g fill="#c9a86a" opacity="0.75">
    <circle cx="256" cy="106" r="13"/>
    <circle cx="398.6" cy="209.6" r="13"/>
    <circle cx="344.2" cy="377.4" r="13"/>
    <circle cx="167.8" cy="377.4" r="13"/>
    <circle cx="113.4" cy="209.6" r="13"/>
  </g>

  <!-- crossed swords -->
  <g fill="#e8d4a8" stroke="#a8834a" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(45 256 256)">
      <polygon points="248,132 264,132 256,104"/>
      <rect x="248" y="132" width="16" height="208" rx="4"/>
      <rect x="228" y="336" width="56" height="13" rx="4"/>
      <rect x="251" y="349" width="10" height="34" rx="3"/>
      <circle cx="256" cy="392" r="10"/>
    </g>
    <g transform="rotate(-45 256 256)">
      <polygon points="248,132 264,132 256,104"/>
      <rect x="248" y="132" width="16" height="208" rx="4"/>
      <rect x="228" y="336" width="56" height="13" rx="4"/>
      <rect x="251" y="349" width="10" height="34" rx="3"/>
      <circle cx="256" cy="392" r="10"/>
    </g>
  </g>
</svg>
